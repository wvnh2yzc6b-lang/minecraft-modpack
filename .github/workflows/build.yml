name: Build mod and modpack

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Warfront mod
        working-directory: mods/warfront
        run: ./gradlew build --stacktrace

      - name: Boot test (dedicated server + game tests)
        working-directory: mods/warfront
        run: |
          set -o pipefail
          timeout 900 ./gradlew runGameTestServer --stacktrace 2>&1 | tee gametest.log
          if grep -E "ERROR|Exception" gametest.log | grep -i warfront; then
            echo "::error::Warfront logged errors during server boot"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Assemble modpack
        run: ./scripts/build-pack.sh

      - name: Summary
        run: cat build/pack-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: warfront-mod
          path: mods/warfront/build/libs/*.jar

      - uses: actions/upload-artifact@v4
        with:
          name: warfront-modpack
          path: |
            build/Warfront-Age-of-Banners.mrpack
            build/pack-report.md
            build/resolved/
